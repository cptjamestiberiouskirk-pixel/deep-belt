<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Deep Belt</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;

      window.__PLAYGROUND_PREVIEW__ = true;

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
